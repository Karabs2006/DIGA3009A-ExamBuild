<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="icon" type="image/png" href="../images/icons/user.png">
    
    <script type="module" src="../js/headerFooter.js" defer></script>
    <script type="module" src="../js/user.js" defer></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/profileStyle.css">
    <link rel="stylesheet" href="../css/musicStyle.css">
    <link rel="stylesheet" href="../css/movieStyle.css">
    <link rel="stylesheet" href="../css/gamesStyle.css">
    
    
</head>
<body>
    <header></header>

    <div id="profile-hero">
        <h1>User Collection</h1>
        <img src="../images/profile.png">
    </div>

    <div id="user-games">

        <span class="section-head">
            <h1>Favourite Games</h1>
        </span>
        
        <div class="games-container game-card-container"></div>
    </div>

     <div id="user-movies">
        
        <span class="section-head">
            <h1>Favourite Movies & Series</h1>
        </span>

        <div class="movie-container movie-card-container"></div>
    </div>

    
     <div id="user-music">
        <span class="section-head">
        <h1>Favourite Songs</h1>
        </span>

        <div class="music-container song-card-container"></div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.1/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.1/DrawSVGPlugin.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.1/ScrollToPlugin.min.js"></script>
    
</body>
<footer></footer>
</html>
